<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mandalart</title>

<style>

:root {
  --bg: #ffffff;
  --text: #27292d;
  --sub: #9aa0a8;

  --line: #e3e5e8;
  --line-dark: #d5d8dc;

  --hover: #f7f7f6;
  --mid: #f4f4f3;

  --dark: #27292d;
  --white: #ffffff;
}

/* ------------------------------
   RESET
------------------------------ */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: var(--bg);
  color: var(--text);

  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button,
textarea {
  font: inherit;
}

button {
  border: 0;
  background: none;
}


/* ------------------------------
   PAGE
------------------------------ */

body {
  display: flex;
  justify-content: center;

  min-height: 100vh;

  padding: 24px;
}

.widget {

  width: min(100%, 900px);

}


/* ------------------------------
   HEADER
------------------------------ */

.header {

  display: flex;
  align-items: flex-end;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 16px;

}

.title-group {
  min-width: 0;
}

.label {

  margin-bottom: 3px;

  color: var(--sub);

  font-size: 11px;
  font-weight: 500;

}

.title {

  margin: 0;

  font-size: 17px;
  font-weight: 600;

  line-height: 1.4;

  letter-spacing: -0.02em;

}


/* ------------------------------
   STATS
------------------------------ */

.stats {

  display: flex;
  align-items: center;

  gap: 14px;

  flex-shrink: 0;

}

.stat {

  display: flex;
  align-items: baseline;

  gap: 5px;

}

.stat-label {

  color: var(--sub);

  font-size: 10px;

}

.stat-value {

  color: var(--text);

  font-size: 13px;
  font-weight: 500;

}

.divider {

  width: 1px;
  height: 12px;

  background: var(--line);

}


/* ------------------------------
   PROGRESS
------------------------------ */

.progress {

  width: 100%;
  height: 2px;

  margin-bottom: 18px;

  background: #f0f1f2;

}

.progress-fill {

  height: 100%;
  width: 0%;

  background: var(--dark);

  transition: width 0.25s ease;

}


/* ------------------------------
   GRID
------------------------------ */

.grid {

  display: grid;

  grid-template-columns: repeat(9, minmax(0, 1fr));

  gap: 3px;

}


/* ------------------------------
   CELL
------------------------------ */

.cell {

  position: relative;

  aspect-ratio: 1 / 1;

  min-width: 0;

  padding: 8px;

  overflow: hidden;

  background: var(--white);

  border: 1px solid var(--line);

  border-radius: 4px;

  cursor: pointer;

  text-align: left;

  color: var(--text);

  transition:
    background .12s ease,
    border-color .12s ease;

}

.cell:hover {

  background: var(--hover);

  border-color: var(--line-dark);

}


/* middle goals */

.cell.mid {

  background: var(--mid);

  border-color: #dedfdf;

}

.cell.mid:hover {

  background: #ededec;

}


/* center goal */

.cell.main {

  background: var(--dark);

  color: var(--white);

  border-color: var(--dark);

}

.cell.main:hover {

  background: #1f2125;

}


/* ------------------------------
   CELL NUMBER
------------------------------ */

.number {

  position: absolute;

  top: 7px;
  left: 8px;

  color: var(--sub);

  font-size: 8px;
  font-weight: 500;

  line-height: 1;

}

.cell.main .number {

  color: rgba(255,255,255,.45);

}


/* ------------------------------
   CELL TEXT
------------------------------ */

.cell-text {

  position: absolute;

  top: 50%;
  left: 8px;
  right: 8px;

  transform: translateY(-50%);

  margin: 0;

  text-align: center;

  font-size: 11px;
  font-weight: 400;

  line-height: 1.45;

  letter-spacing: -0.02em;

  word-break: keep-all;

  display: -webkit-box;

  -webkit-box-orient: vertical;
  -webkit-line-clamp: 4;

  overflow: hidden;

}

.cell.mid .cell-text {

  font-weight: 500;

}

.cell.main .cell-text {

  font-size: 12px;
  font-weight: 600;

}


/* ------------------------------
   STATUS
------------------------------ */

.status {

  position: absolute;

  right: 7px;
  bottom: 7px;

  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: transparent;

  border: 1px solid #c9cdd2;

}

.status.done {

  background: var(--dark);
  border-color: var(--dark);

}

.cell.main .status {

  border-color: rgba(255,255,255,.45);

}

.cell.main .status.done {

  background: var(--white);
  border-color: var(--white);

}


/* ------------------------------
   FOOTER
------------------------------ */

.footer {

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 16px;

  margin-top: 14px;

}

.help {

  color: var(--sub);

  font-size: 10px;

}

.actions {

  display: flex;

  gap: 4px;

}


/* ------------------------------
   BUTTONS
------------------------------ */

.btn {

  padding: 5px 8px;

  border-radius: 4px;

  color: #767b83;

  font-size: 10px;

  cursor: pointer;

}

.btn:hover {

  background: var(--hover);

  color: var(--text);

}


/* ------------------------------
   MODAL
------------------------------ */

.modal-bg {

  position: fixed;

  inset: 0;

  z-index: 100;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(15,15,15,.12);

}

.modal-bg.show {
  display: flex;
}


.modal {

  width: min(100%, 380px);

  background: var(--white);

  border: 1px solid #dcdfe3;
  border-radius: 8px;

  box-shadow:
    0 8px 24px rgba(15,15,15,.08),
    0 1px 4px rgba(15,15,15,.05);

  overflow: hidden;

}


/* modal header */

.modal-header {

  display: flex;
  justify-content: space-between;
  align-items: center;

  min-height: 44px;

  padding: 0 14px;

  border-bottom: 1px solid var(--line);

}

.modal-title {

  font-size: 12px;
  font-weight: 500;

}

.close {

  display: flex;

  align-items: center;
  justify-content: center;

  width: 26px;
  height: 26px;

  border-radius: 4px;

  color: #8d9299;

  cursor: pointer;

}

.close:hover {

  background: var(--hover);

}


/* modal body */

.modal-body {

  padding: 14px;

}

textarea {

  width: 100%;
  height: 110px;

  resize: none;

  padding: 10px;

  color: var(--text);

  background: var(--white);

  border: 1px solid var(--line);
  border-radius: 4px;

  outline: none;

  font-size: 12px;

  line-height: 1.5;

}

textarea:focus {

  border-color: #b5bac0;

}


/* checkbox */

.check-row {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 12px;

  color: #62666d;

  font-size: 11px;

  cursor: pointer;

}

.check-row input {

  width: 14px;
  height: 14px;

  margin: 0;

  accent-color: var(--dark);

}


/* modal footer */

.modal-footer {

  display: flex;

  justify-content: flex-end;

  gap: 5px;

  padding: 10px 14px;

  border-top: 1px solid var(--line);

}

.modal-btn {

  padding: 6px 10px;

  border-radius: 4px;

  color: #72767e;

  font-size: 11px;

  cursor: pointer;

}

.modal-btn:hover {

  background: var(--hover);

}

.modal-btn.primary {

  background: var(--dark);

  color: var(--white);

}

.modal-btn.primary:hover {

  background: #1f2125;

}


/* ------------------------------
   RESPONSIVE
------------------------------ */

@media (max-width: 720px) {

  body {
    padding: 14px;
  }

  .cell {

    padding: 5px;

    border-radius: 3px;

  }

  .cell-text {

    left: 5px;
    right: 5px;

    font-size: 9px;

    line-height: 1.35;

    -webkit-line-clamp: 3;

  }

  .cell.main .cell-text {

    font-size: 10px;

  }

  .number {

    top: 4px;
    left: 5px;

    font-size: 7px;

  }

  .status {

    right: 4px;
    bottom: 4px;

    width: 4px;
    height: 4px;

  }

}


@media (max-width: 480px) {

  body {
    padding: 8px;
  }

  .header {

    align-items: flex-start;

  }

  .stats {

    gap: 7px;

  }

  .stat-label {

    display: none;

  }

  .grid {

    gap: 2px;

  }

}

</style>
</head>


<body>

<div class="widget">

  <!-- HEADER -->

  <header class="header">

    <div class="title-group">

      <div class="label">
        2026
      </div>

      <h1 class="title">
        만다라트
      </h1>

    </div>


    <div class="stats">

      <div class="stat">

        <span class="stat-label">
          완료
        </span>

        <span
          class="stat-value"
          id="doneCount">
          0 / 73
        </span>

      </div>


      <div class="divider"></div>


      <div class="stat">

        <span class="stat-label">
          달성률
        </span>

        <span
          class="stat-value"
          id="percentValue">
          0%
        </span>

      </div>

    </div>

  </header>


  <!-- PROGRESS -->

  <div class="progress">

    <div
      class="progress-fill"
      id="progressFill">
    </div>

  </div>


  <!-- MANDALART -->

  <div
    class="grid"
    id="grid">
  </div>


  <!-- FOOTER -->

  <footer class="footer">

    <div class="help">
      클릭하여 수정
    </div>


    <div class="actions">

      <button
        class="btn"
        id="resetCheck">

        체크 초기화

      </button>


      <button
        class="btn"
        id="resetAll">

        전체 초기화

      </button>

    </div>

  </footer>

</div>


<!-- EDIT MODAL -->

<div
  class="modal-bg"
  id="modalBg">

  <div class="modal">

    <div class="modal-header">

      <div
        class="modal-title"
        id="modalTitle">

        목표 수정

      </div>

      <button
        class="close"
        id="closeModal">

        ×

      </button>

    </div>


    <div class="modal-body">

      <textarea
        id="goalInput"
        placeholder="목표를 입력하세요."></textarea>


      <label class="check-row">

        <input
          type="checkbox"
          id="doneInput">

        완료

      </label>

    </div>


    <div class="modal-footer">

      <button
        class="modal-btn"
        id="cancel">

        취소

      </button>

      <button
        class="modal-btn primary"
        id="save">

        저장

      </button>

    </div>

  </div>

</div>


<script>

/* ================================================
   STORAGE
================================================ */

const STORAGE_KEY = "mandalart_notion_v2";


/* ================================================
   DEFAULT DATA
================================================ */

const defaultData = {

    ],

    [

      {text:"영어 듣기",done:false},
      {text:"JLPT N2",done:false},
      {text:"일본어 복습",done:false},
      {text:"건축 영어",done:false},
      {text:"영어 기록",done:false}
    ],

    [

      {text:"Delft 분석",done:false},
      {text:"RIBA 분석",done:false},
      {text:"도시 연구",done:false},
      {text:"인프라 연구",done:false},
      {text:"독서",done:false},
      {text:"리서치 DB",done:false}
    ],

    [
      {text:"운동",done:false},
      {text:"물 마시기",done:false},
      {text:"수면",done:false},
      {text:"스트레칭",done:false},
      {text:"걷기",done:false},
      {text:"식단",done:false},
      {text:"명상",done:false},
      {text:"컨디션",done:false}
    ],

    [
      {text:"작품 선정",done:false},
      {text:"이미지",done:false},
      {text:"도면",done:false},
      {text:"설명문",done:false},
      {text:"편집",done:false},
      {text:"웹사이트",done:false},
      {text:"SNS",done:false},
      {text:"PDF",done:false}
    ],

    [
      {text:"일기",done:false},
      {text:"주간 회고",done:false},
      {text:"독서 기록",done:false},
      {text:"설계 기록",done:false},
      {text:"스케치",done:false},
      {text:"사진",done:false},
      {text:"아이디어",done:false},
      {text:"월간 리뷰",done:false}
    ],

    [
      {text:"도시계획기사",done:false},
      {text:"LEED GA",done:false},
      {text:"LEED AP",done:false},
      {text:"WELL AP",done:false},
      {text:"BIM",done:false},
      {text:"Revit",done:false},
      {text:"자격 로드맵",done:false},
      {text:"시험 준비",done:false}
    ],

    [
      {text:"집중",done:false},
      {text:"일관성",done:false},
      {text:"감정 관리",done:false},
      {text:"피드백",done:false},
      {text:"관계",done:false},
      {text:"시간 관리",done:false},
      {text:"생활 태도",done:false},
      {text:"꾸준함",done:false}
    ]

  ]

};



/* ================================================
   POSITION DATA
================================================ */

const CENTER_MIDS = {

  "3,3":0,
  "3,4":1,
  "3,5":2,

  "4,3":3,
  "4,5":4,

  "5,3":5,
  "5,4":6,
  "5,5":7

};


const OUTER_MIDS = {

  "1,1":0,
  "1,4":1,
  "1,7":2,

  "4,1":3,
  "4,7":4,

  "7,1":5,
  "7,4":6,
  "7,7":7

};


const BLOCK_GROUP = {

  "0,0":0,
  "0,1":1,
  "0,2":2,

  "1,0":3,
  "1,2":4,

  "2,0":5,
  "2,1":6,
  "2,2":7

};


const DETAIL_POS = {

  "0,0":0,
  "0,1":1,
  "0,2":2,

  "1,0":3,
  "1,2":4,

  "2,0":5,
  "2,1":6,
  "2,2":7

};



/* ================================================
   STATE
================================================ */

let state = load();

let active = null;



function deepClone(obj){

  return JSON.parse(JSON.stringify(obj));

}


function load(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved)
      return JSON.parse(saved);

  }

  catch(e){}

  return deepClone(defaultData);

}


function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}



/* ================================================
   GRID LOGIC
================================================ */

function descriptor(row,col){

  const key = `${row},${col}`;


  if(row === 4 && col === 4){

    return {

      type:"main"

    };

  }


  if(CENTER_MIDS[key] !== undefined){

    return {

      type:"mid",
      index:CENTER_MIDS[key]

    };

  }


  if(OUTER_MIDS[key] !== undefined){

    return {

      type:"mid",
      index:OUTER_MIDS[key]

    };

  }


  const blockRow =
    Math.floor(row / 3);

  const blockCol =
    Math.floor(col / 3);


  const block =
    `${blockRow},${blockCol}`;


  const group =
    BLOCK_GROUP[block];


  if(group !== undefined){

    const lr = row % 3;
    const lc = col % 3;

    const local =
      `${lr},${lc}`;

    const index =
      DETAIL_POS[local];


    if(index !== undefined){

      return {

        type:"detail",
        group,
        index

      };

    }

  }


  return null;

}



/* ================================================
   ITEM
================================================ */

function getItem(d){

  if(d.type === "main")
    return state.main;


  if(d.type === "mid")
    return state.midGoals[d.index];


  return state.details[d.group][d.index];

}



/* ================================================
   CREATE CELL
================================================ */

function createCell(d){

  const item =
    getItem(d);


  const cell =
    document.createElement("button");


  cell.className =
    `cell ${d.type}`;


  /* number */

  const number =
    document.createElement("span");

  number.className =
    "number";


  if(d.type === "main"){

    number.textContent =
      "CORE";

  }

  else if(d.type === "mid"){

    number.textContent =
      String(d.index + 1)
        .padStart(2,"0");

  }

  else{

    number.textContent =
      String(d.index + 1)
        .padStart(2,"0");

  }


  /* text */

  const text =
    document.createElement("div");

  text.className =
    "cell-text";

  text.textContent =
    item.text;


  /* status */

  const status =
    document.createElement("div");

  status.className =
    `status ${item.done ? "done":""}`;


  cell.appendChild(number);

  cell.appendChild(text);

  cell.appendChild(status);


  cell.onclick =
    () => openModal(d);


  return cell;

}



/* ================================================
   RENDER
================================================ */

const grid =
  document.getElementById("grid");


function render(){

  grid.innerHTML = "";


  for(let row=0; row<9; row++){

    for(let col=0; col<9; col++){

      const d =
        descriptor(row,col);


      if(d){

        grid.appendChild(
          createCell(d)
        );

      }

    }

  }


  updateProgress();

}



/* ================================================
   PROGRESS
================================================ */

function updateProgress(){

  let total = 73;

  let done = 0;


  if(state.main.done)
    done++;


  state.midGoals.forEach(

    x => {

      if(x.done)
        done++;

    }

  );


  state.details.forEach(

    group =>

      group.forEach(

        x => {

          if(x.done)
            done++;

        }

      )

  );


  const percent =
    Math.round(
      done / total * 100
    );


  document
    .getElementById("doneCount")
    .textContent =
      `${done} / ${total}`;


  document
    .getElementById("percentValue")
    .textContent =
      `${percent}%`;


  document
    .getElementById("progressFill")
    .style.width =
      `${percent}%`;

}



/* ================================================
   MODAL
================================================ */

const modalBg =
  document.getElementById("modalBg");

const goalInput =
  document.getElementById("goalInput");

const doneInput =
  document.getElementById("doneInput");

const modalTitle =
  document.getElementById("modalTitle");


function openModal(d){

  active = d;


  const item =
    getItem(d);


  if(d.type === "main"){

    modalTitle.textContent =
      "중심 목표";

  }

  else if(d.type === "mid"){

    modalTitle.textContent =
      `핵심 목표 ${d.index + 1}`;

  }

  else{

    modalTitle.textContent =
      `세부 목표 ${d.index + 1}`;

  }


  goalInput.value =
    item.text;


  doneInput.checked =
    item.done;


  modalBg.classList.add("show");


  requestAnimationFrame(
    () => goalInput.focus()
  );

}


function closeModal(){

  modalBg.classList.remove("show");

  active = null;

}


function saveModal(){

  if(!active)
    return;


  const item =
    getItem(active);


  item.text =
    goalInput.value.trim()
    || "목표";


  item.done =
    doneInput.checked;


  save();

  render();

  closeModal();

}



/* ================================================
   BUTTON EVENTS
================================================ */

document
  .getElementById("save")
  .onclick =
    saveModal;


document
  .getElementById("cancel")
  .onclick =
    closeModal;


document
  .getElementById("closeModal")
  .onclick =
    closeModal;



modalBg.onclick =
  e => {

    if(e.target === modalBg)
      closeModal();

  };



/* reset check */

document
  .getElementById("resetCheck")
  .onclick =
  () => {

    if(
      !confirm(
        "완료 표시를 모두 초기화할까요?"
      )
    )
      return;


    state.main.done = false;


    state.midGoals.forEach(

      x => x.done = false

    );


    state.details.forEach(

      group =>

        group.forEach(

          x => x.done = false

        )

    );


    save();

    render();

  };



/* reset all */

document
  .getElementById("resetAll")
  .onclick =
  () => {

    if(
      !confirm(
        "모든 내용을 초기 상태로 되돌릴까요?"
      )
    )
      return;


    state =
      deepClone(defaultData);


    save();

    render();

  };



/* keyboard */

document.addEventListener(

  "keydown",

  e => {

    if(
      e.key === "Escape"
    ){

      closeModal();

    }


    if(
      e.key === "Enter"
      &&
      (e.ctrlKey || e.metaKey)
      &&
      modalBg.classList.contains("show")
    ){

      saveModal();

    }

  }

);



render();

</script>

</body>
</html>
