<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mandalart</title>

<style>

:root {
  --bg: #ffffff;
  --text: #27292d;
  --sub: #9aa0a8;

  --line: #e3e5e8;
  --line-dark: #cfd3d8;

  --hover: #f7f7f6;
  --mid: #f4f4f3;

  --dark: #27292d;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: var(--bg);
  color: var(--text);

  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  justify-content: center;

  min-height: 100vh;
  padding: 24px;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  background: none;
}

.widget {
  width: min(100%, 900px);
}


/* ==============================
   HEADER
============================== */

.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 16px;
}


/* 제목 */

.title-input {

  width: 300px;
  max-width: 60vw;

  padding: 2px 4px;
  margin-left: -4px;

  border: 1px solid transparent;
  border-radius: 4px;

  background: transparent;

  color: var(--text);

  outline: none;

  font-size: 17px;
  font-weight: 600;

  line-height: 1.4;

  letter-spacing: -0.02em;
}

.title-input:hover {
  background: var(--hover);
}

.title-input:focus {
  background: var(--white);
  border-color: var(--line-dark);
}


/* ==============================
   STATS
============================== */

.stats {
  display: flex;
  align-items: center;

  gap: 14px;

  flex-shrink: 0;
}

.stat {
  display: flex;
  align-items: baseline;

  gap: 5px;
}

.stat-label {
  color: var(--sub);
  font-size: 10px;
}

.stat-value {
  color: var(--text);

  font-size: 13px;
  font-weight: 500;
}

.divider {
  width: 1px;
  height: 12px;

  background: var(--line);
}


/* ==============================
   PROGRESS
============================== */

.progress {
  width: 100%;
  height: 2px;

  margin-bottom: 18px;

  background: #f0f1f2;
}

.progress-fill {
  height: 100%;
  width: 0%;

  background: var(--dark);

  transition: width .25s ease;
}


/* ==============================
   GRID
============================== */

.grid {

  display: grid;

  grid-template-columns:
    repeat(9, minmax(0, 1fr));

  gap: 3px;

}


/* ==============================
   CELL
============================== */

.cell {

  position: relative;

  aspect-ratio: 1 / 1;

  min-width: 0;

  overflow: hidden;

  background: var(--white);

  border: 1px solid var(--line);
  border-radius: 4px;

  transition:
    background .12s ease,
    border-color .12s ease;
}

.cell:hover {
  border-color: var(--line-dark);
}


/* 핵심 목표 */

.cell.mid {
  background: var(--mid);
  border-color: #dedfdf;
}

.cell.mid:hover {
  background: #eeeeed;
}


/* 중심 목표 */

.cell.main {
  background: var(--dark);
  border-color: var(--dark);
}

.cell.main:hover {
  background: #222428;
}


/* ==============================
   NUMBER
============================== */

.number {
  position: absolute;

  top: 7px;
  left: 8px;

  z-index: 2;

  color: var(--sub);

  font-size: 8px;
  font-weight: 500;

  pointer-events: none;
}

.cell.main .number {
  color: rgba(255,255,255,.48);
}


/* ==============================
   INLINE TEXT INPUT
============================== */

.cell-input {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  padding:
    24px
    14px
    22px;

  border: 0;
  outline: none;

  background: transparent;

  color: var(--text);

  text-align: center;

  font-size: 11px;
  font-weight: 400;

  line-height: 1.4;

  letter-spacing: -0.02em;

  cursor: text;
}


/* placeholder */

.cell-input::placeholder {
  color: transparent;
}


/* hover */

.cell-input:hover {
  background: rgba(0,0,0,.012);
}


/* focus */

.cell-input:focus {
  box-shadow:
    inset 0 0 0 1px var(--line-dark);
}


/* 핵심 목표 */

.cell.mid .cell-input {
  font-weight: 500;
}


/* 중심 목표 */

.cell.main .cell-input {

  color: var(--white);

  font-size: 12px;
  font-weight: 600;
}

.cell.main .cell-input:focus {
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.45);
}


/* 완료된 텍스트 */

.cell.completed .cell-input {
  opacity: .48;
}


/* ==============================
   CHECK TOGGLE
============================== */

.check-area {

  position: absolute;

  right: 4px;
  bottom: 4px;

  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 25px;
  height: 25px;

  padding: 0;

  cursor: pointer;

  border-radius: 50%;
}


/* 실제 원 */

.check-dot {

  width: 11px;
  height: 11px;

  border: 1.4px solid #b9bec5;

  border-radius: 50%;

  background: var(--white);

  transition:
    background .12s ease,
    border-color .12s ease,
    transform .12s ease;
}


/* hover */

.check-area:hover .check-dot {

  border-color: var(--dark);

  transform: scale(1.12);
}


/* 완료 */

.check-area.done .check-dot {

  background: var(--dark);

  border-color: var(--dark);
}


/* 중앙 셀 */

.cell.main .check-dot {

  background: transparent;

  border-color:
    rgba(255,255,255,.48);
}

.cell.main .check-area:hover .check-dot {

  border-color: var(--white);
}

.cell.main .check-area.done .check-dot {

  background: var(--white);

  border-color: var(--white);
}


/* ==============================
   FOOTER
============================== */

.footer {

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 16px;

  margin-top: 14px;
}

.help {
  color: var(--sub);
  font-size: 10px;
}

.actions {
  display: flex;
  gap: 4px;
}

.btn {

  padding: 5px 8px;

  border-radius: 4px;

  color: #767b83;

  font-size: 10px;

  cursor: pointer;
}

.btn:hover {
  background: var(--hover);
  color: var(--text);
}


/* ==============================
   RESPONSIVE
============================== */

@media (max-width: 720px) {

  body {
    padding: 14px;
  }

  .cell-input {

    padding:
      19px
      7px
      18px;

    font-size: 9px;
  }

  .cell.main .cell-input {
    font-size: 10px;
  }

  .number {

    top: 5px;
    left: 6px;

    font-size: 7px;
  }

  .check-area {

    width: 21px;
    height: 21px;

    right: 2px;
    bottom: 2px;
  }

  .check-dot {

    width: 9px;
    height: 9px;
  }

}


@media (max-width: 480px) {

  body {
    padding: 8px;
  }

  .stats {
    gap: 7px;
  }

  .stat-label {
    display: none;
  }

  .grid {
    gap: 2px;
  }

}

</style>
</head>


<body>

<div class="widget">

  <header class="header">

    <input
      id="widgetTitle"
      class="title-input"
      type="text"
      value="만다라트"
      maxlength="40"
      aria-label="제목"
    >


    <div class="stats">

      <div class="stat">

        <span class="stat-label">
          완료
        </span>

        <span
          id="doneCount"
          class="stat-value">

          0 / 73

        </span>

      </div>


      <div class="divider"></div>


      <div class="stat">

        <span class="stat-label">
          달성률
        </span>

        <span
          id="percentValue"
          class="stat-value">

          0%

        </span>

      </div>

    </div>

  </header>


  <div class="progress">

    <div
      id="progressFill"
      class="progress-fill">
    </div>

  </div>


  <div
    id="grid"
    class="grid">
  </div>


  <footer class="footer">

    <div class="help">
      텍스트 클릭하여 바로 수정 · 우측 하단 원을 클릭하여 완료
    </div>


    <div class="actions">

      <button
        class="btn"
        id="resetCheck">

        체크 초기화

      </button>


      <button
        class="btn"
        id="resetAll">

        전체 초기화

      </button>

    </div>

  </footer>

</div>



<script>

/* ==============================
   STORAGE
============================== */

const STORAGE_KEY =
  "mandalart_notion_v4";


/* ==============================
   DEFAULT
============================== */

const defaultData = {

  title: "만다라트",

  main: {
    text: "",
    done: false
  },

  midGoals:
    Array.from(
      { length: 8 },

      () => ({
        text: "",
        done: false
      })
    ),

  details:
    Array.from(
      { length: 8 },

      () =>
        Array.from(
          { length: 8 },

          () => ({
            text: "",
            done: false
          })
        )
    )

};


/* ==============================
   POSITION
============================== */

const CENTER_MIDS = {

  "3,3":0,
  "3,4":1,
  "3,5":2,

  "4,3":3,
  "4,5":4,

  "5,3":5,
  "5,4":6,
  "5,5":7

};


const OUTER_MIDS = {

  "1,1":0,
  "1,4":1,
  "1,7":2,

  "4,1":3,
  "4,7":4,

  "7,1":5,
  "7,4":6,
  "7,7":7

};


const BLOCK_GROUP = {

  "0,0":0,
  "0,1":1,
  "0,2":2,

  "1,0":3,
  "1,2":4,

  "2,0":5,
  "2,1":6,
  "2,2":7

};


const DETAIL_POS = {

  "0,0":0,
  "0,1":1,
  "0,2":2,

  "1,0":3,
  "1,2":4,

  "2,0":5,
  "2,1":6,
  "2,2":7

};


/* ==============================
   STATE
============================== */

let state = load();


function clone(obj) {

  return JSON.parse(
    JSON.stringify(obj)
  );

}


function load() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(saved) {

      return JSON.parse(saved);

    }

  }

  catch(e) {}

  return clone(defaultData);

}


function save() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* ==============================
   TITLE
============================== */

const widgetTitle =
  document.getElementById(
    "widgetTitle"
  );


widgetTitle.value =
  state.title || "만다라트";


widgetTitle.addEventListener(
  "input",

  () => {

    state.title =
      widgetTitle.value;

    save();

  }
);


/* ==============================
   DESCRIPTOR
============================== */

function descriptor(row,col) {

  const key =
    `${row},${col}`;


  if(row === 4 && col === 4) {

    return {
      type:"main"
    };

  }


  if(
    CENTER_MIDS[key]
    !== undefined
  ) {

    return {

      type:"mid",
      index:CENTER_MIDS[key]

    };

  }


  if(
    OUTER_MIDS[key]
    !== undefined
  ) {

    return {

      type:"mid",
      index:OUTER_MIDS[key]

    };

  }


  const blockRow =
    Math.floor(row / 3);


  const blockCol =
    Math.floor(col / 3);


  const block =
    `${blockRow},${blockCol}`;


  const group =
    BLOCK_GROUP[block];


  if(group !== undefined) {

    const lr =
      row % 3;

    const lc =
      col % 3;


    const local =
      `${lr},${lc}`;


    const index =
      DETAIL_POS[local];


    if(index !== undefined) {

      return {

        type:"detail",
        group,
        index

      };

    }

  }


  return null;

}


/* ==============================
   DATA ITEM
============================== */

function getItem(d) {

  if(d.type === "main") {

    return state.main;

  }


  if(d.type === "mid") {

    return state
      .midGoals[d.index];

  }


  return state
    .details[d.group][d.index];

}


/* ==============================
   CELL
============================== */

function createCell(d) {

  const item =
    getItem(d);


  const cell =
    document.createElement("div");


  cell.className =
    `cell ${d.type}`;


  if(item.done) {

    cell.classList.add(
      "completed"
    );

  }


  /* NUMBER */

  const number =
    document.createElement("span");


  number.className =
    "number";


  if(d.type === "main") {

    number.textContent =
      "CORE";

  }

  else {

    number.textContent =
      String(d.index + 1)
        .padStart(2,"0");

  }


  /* INPUT */

  const input =
    document.createElement("input");


  input.type =
    "text";


  input.className =
    "cell-input";


  input.value =
    item.text;


  input.maxLength =
    40;


  input.setAttribute(
    "aria-label",
    "목표 입력"
  );


  input.addEventListener(
    "input",

    () => {

      item.text =
        input.value;

      save();

    }
  );


  input.addEventListener(
    "keydown",

    e => {

      if(e.key === "Enter") {

        input.blur();

      }

    }
  );


  /* CHECK */

  const check =
    document.createElement("button");


  check.type =
    "button";


  check.className =
    `check-area ${
      item.done
        ? "done"
        : ""
    }`;


  check.setAttribute(
    "aria-label",
    item.done
      ? "완료 취소"
      : "완료"
  );


  const dot =
    document.createElement("span");


  dot.className =
    "check-dot";


  check.appendChild(dot);


  check.addEventListener(
    "click",

    e => {

      e.preventDefault();
      e.stopPropagation();


      item.done =
        !item.done;


      save();

      render();

    }
  );


  cell.appendChild(number);

  cell.appendChild(input);

  cell.appendChild(check);


  return cell;

}


/* ==============================
   RENDER
============================== */

const grid =
  document.getElementById("grid");


function render() {

  grid.innerHTML = "";


  for(
    let row = 0;
    row < 9;
    row++
  ) {

    for(
      let col = 0;
      col < 9;
      col++
    ) {

      const d =
        descriptor(row,col);


      if(d) {

        grid.appendChild(
          createCell(d)
        );

      }

    }

  }


  updateProgress();

}


/* ==============================
   PROGRESS
============================== */

function updateProgress() {

  const total = 73;

  let done = 0;


  if(state.main.done) {

    done++;

  }


  state.midGoals.forEach(
    item => {

      if(item.done)
        done++;

    }
  );


  state.details.forEach(
    group =>

      group.forEach(
        item => {

          if(item.done)
            done++;

        }
      )

  );


  const percent =
    Math.round(
      done / total * 100
    );


  document
    .getElementById(
      "doneCount"
    )
    .textContent =
      `${done} / ${total}`;


  document
    .getElementById(
      "percentValue"
    )
    .textContent =
      `${percent}%`;


  document
    .getElementById(
      "progressFill"
    )
    .style.width =
      `${percent}%`;

}


/* ==============================
   RESET CHECK
============================== */

document
  .getElementById(
    "resetCheck"
  )
  .addEventListener(
    "click",

    () => {

      if(
        !confirm(
          "완료 표시를 모두 초기화할까요?"
        )
      ) {

        return;

      }


      state.main.done =
        false;


      state.midGoals.forEach(
        item => {

          item.done =
            false;

        }
      );


      state.details.forEach(
        group =>

          group.forEach(
            item => {

              item.done =
                false;

            }
          )

      );


      save();

      render();

    }
  );


/* ==============================
   RESET ALL
============================== */

document
  .getElementById(
    "resetAll"
  )
  .addEventListener(
    "click",

    () => {

      if(
        !confirm(
          "제목, 목표, 완료 상태를 모두 초기화할까요?"
        )
      ) {

        return;

      }


      state =
        clone(defaultData);


      widgetTitle.value =
        state.title;


      save();

      render();

    }
  );


/* ==============================
   INITIAL RENDER
============================== */

render();

</script>

</body>
</html>
